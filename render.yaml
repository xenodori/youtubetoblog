services:
  - type: web
    name: youtube-to-blog
    env: node
    buildCommand: "./render-build.sh && npm install && npm run build"
    startCommand: "npm start"
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: true
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/google-chrome-stable
